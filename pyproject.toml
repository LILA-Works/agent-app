[project]
name = "lila-app"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = ["lila-core"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
lila-core = { workspace = true }

[dependency-groups]
dev = ["black", "ruff", "basedpyright"]


[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = []

# Pylance reads this too, so the editor and `make typecheck` agree.
[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
include = ["packages/lila-core/src"]
exclude = ["**/__pycache__", "**/.venv", "**/.pytest_cache", "**/.ruff_cache"]
