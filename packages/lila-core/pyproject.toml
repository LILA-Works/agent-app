[project]
name = "lila-core"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
  "httpx",
  "pyyaml",
  "jsonschema",
  "pydantic",
  "sqlalchemy[asyncio]",
  "aiosqlite",
  "alembic",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lila"]

[tool.ruff]
# use the root ruff config
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tst"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
